
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Chart Scanner</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
.panel {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}
button {
  background: #16a34a;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  margin-top: 15px;
}
img {
  max-width: 100%;
  margin-top: 15px;
}
</style>
</head>
<body>
<h1>INDEX CHART SCANNER</h1>
<p>Forex & Indices Chart Analysis</p>

<div class="panel">
  <h2>Upload Your Chart</h2>
  <input type="file" id="chart" accept="image/*">
  <br>
  <img id="preview" alt="Chart preview">
  <br>
  <button onclick="analyze()">Analyze Chart</button>
  <h2 id="result"></h2>
</div>

<script>
const input = document.getElementById("chart");
input.addEventListener("change", function() {
  const file = input.files[0];
  if (file) {
    document.getElementById("preview").src =
      URL.createObjectURL(file);
  }
});
