
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Chart Scanner</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
.panel {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}
button {
  background: #16a34a;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  margin-top: 15px;
}
img {
  max-width: 100%;
  margin-top: 15px;
}
#result {
  font-size: 18px;
  line-height: 1.6;
  white-space: pre-line;
  overflow-wrap: break-word;
  text-align: left;
  margin-top: 25px;
}
</style>
</head>
<body>
<h1>INDEX CHART SCANNER</h1>
<p>Forex & Indices Chart Analysis</p>

<div class="panel">
  <h2>Upload Your Chart</h2>
  <input type="file" id="chart" accept="image/*">
  <br>
  <img id="preview" alt="Chart preview">
  <br>
  <button onclick="analyze()">Analyze Chart</button>
  <h2 id="result"></h2>
</div>

<script>


const input = document.getElementById("chart");
const preview = document.getElementById("preview");
const result = document.getElementById("result");

input.addEventListener("change", function () {
  result.textContent = "";
  const file = input.files[0];

  if (!file) {
    preview.removeAttribute("src");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    preview.src = event.target.result;
    preview.style.display = "block";
  };

  reader.onerror = function () {
    result.textContent = "Could not load the image.";
  };

  reader.readAsDataURL(file);
});


function analyze() {
  if (!input.files.length) {
    result.textContent = "Please upload a chart first.";
    return;
  }

  result.textContent = "Analyzing chart image...";

  const image = new Image();

  image.onload = function () {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 200;
    canvas.height = 150;
    ctx.drawImage(image, 0, 0, 200, 150);

    const pixels = ctx.getImageData(
      0, 0, 200, 150
    ).data;

    let green = 0;
    let red = 0;
    
let leftY = [];
let rightY = [];
const width = 200;
const height = 150;

    for (let i = 0; i < pixels.length; i += 4) {
      const r = pixels[i];
      const g = pixels[i + 1];
      const b = pixels[i + 2];
      
const x = (i / 4) % width;
const y = Math.floor((i / 4) / width);


if (g > r * 1.2 && b > r * 1.1 && g > 65) {      
  green++;

  if (x < width / 3) {
    leftY.push(y);
  } else if (x > width * 2 / 3) {
    rightY.push(y);
  }
}

if (r > g * 1.5 && r > b * 1.3 && r > 70) {
  red++;

  if (x < width / 3) {
    leftY.push(y);
  } else if (x > width * 2 / 3) {
    rightY.push(y);
  }
}
}  

    const total = green + red;
    
let direction = "Pattern unclear";

if (leftY.length > 10 && rightY.length > 10) {
  const average = values =>
    values.reduce((sum, value) => sum + value, 0) /
    values.length;

  const difference = average(leftY) - average(rightY);

  if (difference > 10) {
    direction = "UPWARD PATTERN (experimental)";
  } else if (difference < -10) {
    direction = "DOWNWARD PATTERN (experimental)";
  } else {
    direction = "SIDEWAYS PATTERN (experimental)";
  }
}

let support = "Not detected";
let resistance = "Not detected";

if (leftY.length > 10 && rightY.length > 10) {
  support = "Possible lower chart area";
  resistance = "Possible upper chart area";
}
    if (total < 20) {
      result.textContent =
        "No clear red or green chart features detected.";
    } else {
      result.textContent =
      "CHART ANALYSIS REPORT\n\nGreen pixels: " +
        green +
        " | Red pixels: " +
        red +
     ". Visual pattern: " +
direction +
        
" | Support: " + support +
" | Resistance: " + resistance +
". These are placeholder chart areas, not actual price levels. " +
"This is an experimental image estimate, not a trading signal.";
    }
  };

  image.onerror = function () {
    result.textContent = "Could not read the image.";
  };

  image.src = URL.createObjectURL(input.files[0]);
}
  

</script> 
  </body>
</html>
