
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Chart Scanner</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
.panel {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}
button {
  background: #16a34a;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  margin-top: 15px;
}
img {
  max-width: 100%;
  margin-top: 15px;
}
</style>
</head>
<body>
<h1>INDEX CHART SCANNER</h1>
<p>Forex & Indices Chart Analysis</p>

<div class="panel">
  <h2>Upload Your Chart</h2>
  <input type="file" id="chart" accept="image/*">
  <br>
  <img id="preview" alt="Chart preview">
  <br>
  <button onclick="analyze()">Analyze Chart</button>
  <h2 id="result"></h2>
</div>

<script>


const input = document.getElementById("chart");
const preview = document.getElementById("preview");
const result = document.getElementById("result");

input.addEventListener("change", function () {
  result.textContent = "";
  const file = input.files[0];

  if (!file) {
    preview.removeAttribute("src");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    preview.src = event.target.result;
    preview.style.display = "block";
  };

  reader.onerror = function () {
    result.textContent = "Could not load the image.";
  };

  reader.readAsDataURL(file);
});


function analyze() {
  if (!input.files.length) {
    result.textContent = "Please upload a chart first.";
    return;
  }

  result.textContent = "Analyzing chart image...";

  const image = new Image();

  image.onload = function () {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 200;
    canvas.height = 150;
    ctx.drawImage(image, 0, 0, 200, 150);

    const pixels = ctx.getImageData(
      0, 0, 200, 150
    ).data;

    let green = 0;
    let red = 0;

    for (let i = 0; i < pixels.length; i += 4) {
      const r = pixels[i];
      const g = pixels[i + 1];
      const b = pixels[i + 2];

      if (g > r * 1.5 && g > b * 1.3 && g > 70) {
        green++;
      }

      if (r > g * 1.5 && r > b * 1.3 && r > 70) {
        red++;
      }
    }

    const total = green + red;

    if (total < 20) {
      result.textContent =
        "No clear red or green chart features detected.";
    } else {
      result.textContent =
        "Image analysis complete. Green pixels: " +
        green +
        " | Red pixels: " +
        red +
        ". These are color measurements, not trading signals.";
    }
  };

  image.onerror = function () {
    result.textContent = "Could not read the image.";
  };

  image.src = URL.createObjectURL(input.files[0]);
}
  

</script> 
  </body>
</html>
